<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Write Blog | NMDHRS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #e0f2ff, #f4faff);
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .blog-card {
            max-width: 720px;
            margin: 80px auto 40px;
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
            padding: 35px;
        }

        h2 {
            font-weight: 600;
            color: #003366;
            margin-bottom: 25px;
        }

        .form-control {
            border-radius: 10px;
            font-size: 15px;
        }

        textarea.form-control {
            resize: vertical;
        }

        .btn-primary {
            background-color: #0056b3;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.3s;
        }

        .btn-primary:hover {
            background-color: #003d80;
        }

        .logout-btn {
            margin-left: auto;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="#">NMDHRS</a>
    <div class="ms-auto">
      <a href="{{ url_for('doctor_logout') }}" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
  </div>
</nav>

<!-- Form Card -->
<div class="blog-card">
    <h2 class="text-center">📝 Submit Your Blog</h2>
    <form method="post">
        <div class="mb-3">
            <input type="text" name="doctor_name" class="form-control" placeholder="Doctor's Full Name" required>
        </div>
        <div class="mb-3">
            <input type="text" name="hospital_name" class="form-control" placeholder="Hospital Name" required>
        </div>
        <div class="mb-3">
            <input type="text" name="department" class="form-control" placeholder="Department (e.g., Neurology)" required>
        </div>
        <div class="mb-3">
            <input type="text" name="title" class="form-control" placeholder="Blog Title" required>
        </div>
        <div class="mb-4">
            <textarea name="content" rows="8" class="form-control" placeholder="Write your blog content here..." required></textarea>
        </div>
        <div class="d-grid">
            <button type="submit" class="btn btn-primary">📤 Publish Blog</button>
        </div>


    </form>
</div>

<!-- Footer -->
<footer>
    &copy; 2025 National Medical Digital Health Record System | Ministry of Health, India
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
