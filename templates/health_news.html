<!DOCTYPE html>
<html>
<head>
    <title>Health News & Advisories</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2 class="mb-4 text-center">📰 Health News & Advisories</h2>

    {% for article in articles %}
    <div class="card mb-3">
        <div class="card-header">
            <strong>{{ article.title }}</strong>
            <small class="text-muted float-end">{{ article.published }}</small>
        </div>
        <div class="card-body">
            <p>{{ article.summary|safe }}</p>
            <a href="{{ article.link }}" target="_blank" class="btn btn-sm btn-primary">Read Full</a>
        </div>
    </div>
    {% endfor %}
</body>
</html>
