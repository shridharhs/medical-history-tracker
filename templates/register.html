<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hospital Registration | NMDHRS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #eef3f7;
            font-family: 'Segoe UI', sans-serif;
        }
        .register-container {
            max-width: 450px;
            margin: 60px auto;
            background-color: #fff;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
        }
        .gov-header {
            background-color: #ffffff;
            padding: 20px 30px;
            border-bottom: 2px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .gov-header .gov-title {
            text-align: center;
            flex-grow: 1;
        }
        .gov-title div {
            font-size: 18px;
            font-weight: bold;
            color: #003366;
        }
        .logo-img {
            height: 50px;
        }
        .form-label {
            font-weight: 600;
        }
    </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">🇮🇳 NMDHRS</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/login">Hospital Login</a></li>
        <li class="nav-item"><a class="nav-link" href="/register">Hospital Register</a></li>
        <li class="nav-item"><a class="nav-link disabled" href="#">Services</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Header -->
<div class="gov-header">
    <img src="/static/indian_flag.png" alt="India Flag" class="logo-img">
    <div class="gov-title">
        <div>REPUBLIC OF INDIA</div>
        <div>Ministry of Health and Family Welfare</div>
        <div>National Medical Digital Health Record System (NMDHRS)</div>
    </div>
    <img src="/static/health_logo.png" alt="Health Logo" class="logo-img">
</div>

<!-- Registration Form -->
<div class="register-container">
    <h4 class="text-center mb-4">Hospital Registration Portal</h4>
    <form method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Hospital Username</label>
            <input type="text" class="form-control" id="username" name="username" required placeholder="Choose a hospital username">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Create Password</label>
            <input type="password" class="form-control" id="password" name="password" required placeholder="Enter a secure password">
        </div>
        <div class="d-grid">
            <button type="submit" class="btn btn-success btn-block">Register</button>
        </div>
        <div class="mt-3 text-center">
            <p class="mb-0">Already registered? <a href="/login">Login here</a></p>
        </div>
    </form>
</div>

</body>
</html>
