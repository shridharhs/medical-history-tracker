<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Patient Record | {{ hospital }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #eef3f7;
            font-family: 'Segoe UI', sans-serif;
        }
        .upload-container {
            max-width: 700px;
            margin: 40px auto;
            background-color: #fff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
        }
        .form-label {
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container upload-container">
    <h4 class="text-center mb-4">Upload Patient Record - <span class="text-primary">{{ hospital }}</span></h4>
    <form method="post">
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Aadhaar Number</label>
                <input type="text" name="aadhaar" id="aadhaar" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" id="name" class="form-control" required>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-4">
                <label class="form-label">Age</label>
                <input type="number" name="age" id="age" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Gender</label>
                <select name="gender" id="gender" class="form-control" required>
                    <option disabled selected>-- Select Gender --</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Mobile Number</label>
                <input type="text" name="mobile" id="mobile" class="form-control" required>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Blood Group</label>
                <select name="blood_group" id="blood_group" class="form-control" required>
                    <option disabled selected>-- Select Blood Group --</option>
                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>O+</option>
                    <option>O-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Doctor Name</label>
                <input type="text" name="doctor" class="form-control" required>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-12">
                <label class="form-label">Department</label>
                <input type="text" name="department" class="form-control" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Illness</label>
            <input type="text" name="illness" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Prescription</label>
            <textarea name="prescription" class="form-control" rows="3" required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea name="address" id="address" class="form-control" rows="3" required></textarea>
        </div>

        <div class="d-grid mt-4">
            <button type="submit" class="btn btn-success btn-lg">Upload Record</button>
        </div>
    </form>

    <div class="text-center mt-3">
        <a href="/logout" class="btn btn-outline-danger btn-sm">Logout</a>
    </div>
</div>

<!-- 🔁 Auto-Fill Script -->
<script>
document.getElementById('aadhaar').addEventListener('blur', function () {
    const aadhaar = this.value.trim();
    if (aadhaar.length === 12) {
        fetch(`/get_patient_details?aadhaar=${aadhaar}`)
            .then(response => response.json())
            .then(data => {
                if (!data.error) {
                    document.getElementById('name').value = data.name;
                    document.getElementById('mobile').value = data.mobile;
                    document.getElementById('blood_group').value = data.blood_group;
                    document.getElementById('age').value = data.age;
                    document.getElementById('address').value = data.address;

                    const genderSelect = document.getElementById('gender');
                    for (let option of genderSelect.options) {
                        if (option.text === data.gender) {
                            option.selected = true;
                            break;
                        }
                    }
                } else {
                    console.log('No record found for this Aadhaar');
                }
            })
            .catch(err => {
                console.error('Error fetching patient details:', err);
            });
    }
});
</script>

</body>
</html>
